kind: train
paths:
  root: data
  scenes: scenes
  rgb: rgb
  output: outputs/train_perception_4b
model:
  role: perception
  model_id: Qwen/Qwen3-VL-4B-Instruct
  revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  image_width: 640
  image_height: 352
  frame_window: 128
  distance_bin_edges: [0.5, 1.0, 2.0, 4.0]
